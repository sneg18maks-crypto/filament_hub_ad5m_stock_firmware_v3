name: Build Filament Hub APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android --org com.filamenthub .

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36"

      - name: Configure compileSdk
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle")
          ]

          gradle = next((p for p in files if p.exists()), None)

          if gradle is None:
              raise SystemExit("Gradle file not found")

          text = gradle.read_text()

          text, count1 = re.subn(
              r'compileSdk\s*=\s*flutter\.compileSdkVersion',
              'compileSdk = 36',
              text
          )

          text, count2 = re.subn(
              r'compileSdkVersion\s+flutter\.compileSdkVersion',
              'compileSdkVersion 36',
              text
          )

          if count1 + count2 == 0:
              if not re.search(r'compileSdk(?:Version)?\s*(?:=\s*)?36', text):
                  raise SystemExit("Failed to configure compileSdk 36")

          gradle.write_text(text)
          print("Android compileSdk set to 36")
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Configure network permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          if "android.permission.INTERNET" not in s:
              s = s.replace(
                  "<application",
                  '<uses-permission android:name="android.permission.INTERNET" />\n    <application',
                  1
              )

          if "usesCleartextTraffic" not in s:
              s = s.replace(
                  "<application",
                  '<application android:usesCleartextTraffic="true"',
                  1
              )

          p.write_text(s)
          PY

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Filament-Hub-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
